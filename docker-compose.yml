services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forge3d
      POSTGRES_USER: forge3d
      POSTGRES_PASSWORD: forge3d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge3d -d forge3d"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - forge3d-postgres:/var/lib/postgresql/data

volumes:
  forge3d-postgres:
