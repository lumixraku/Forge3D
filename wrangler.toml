name = "forge3d-canvas-studio"
main = "worker.ts"
compatibility_date = "2026-07-21"

# The custom domain lives with the worker so a rename cannot silently strand it
# again: 263b56e renamed the worker and left this domain on the old one.
[[routes]]
pattern = "forge3d.lumixraku.org"
custom_domain = true

[assets]
directory = "./dist-cloudflare"
binding = "ASSETS"
not_found_handling = "single-page-application"
[[d1_databases]]
binding = "DB"
database_name = "forge3d"
database_id = "9b7fb975-9f25-4655-8306-f163c5f6fe89"


[vars]
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-v4-flash"
